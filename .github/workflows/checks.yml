name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: studio
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: studio_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U studio -d studio_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install uv==0.12.15
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: uv sync --frozen
      - run: uv run ruff check backend tests scripts
      - run: uv run pytest -q
        env:
          TEST_POSTGRES_URL: postgresql+psycopg://studio:test-only@localhost:5432/studio_test
      - run: npm ci --ignore-scripts && npm test && npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
        env:
          TEST_POSTGRES_URL: postgresql+psycopg://studio:test-only@localhost:5432/studio_test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: frontend/test-results
