[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "spark-creative-studio"
version = "0.1.0"
description = "Private visual storytelling studio"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn==0.53.0",
  "pydantic==2.13.5",
  "sqlalchemy==2.0.53",
  "psycopg[binary]==3.3.5",
  "httpx==0.28.1",
  "pillow==12.3.0",
  "argon2-cffi>=25.1,<26",
  "python-multipart>=0.0.22,<1",
  "python-dotenv>=1.2,<2",
]

[dependency-groups]
dev = ["pytest>=9,<10", "ruff>=0.14,<1"]

[tool.hatch.build.targets.wheel]
packages = ["backend/studio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E9", "F"]
